<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a1628">
<title>لوحة الحجوزات | مؤسسة نقاء</title>
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5f9;--surface:#fff;--line:#e5e9f0;--line2:#eef1f6;--ink:#0b1b33;--ink2:#46536b;--mut:#8691a5;
  --navy:#0a1628;--navy2:#13284a;--gold:#c9a84c;--gold-d:#9c7a24;--gold-s:#fbf6e8;
  --new:#b45309;--new-s:#fff5e2;--con:#1d4ed8;--con-s:#ebf1ff;--cfm:#15803d;--cfm-s:#e7f6ec;--done:#475569;--done-s:#eef1f5;--can:#dc2626;--can-s:#fdecec;
  --wa:#1fa855;--r:16px;--sh:0 1px 2px rgba(11,27,51,.04),0 4px 16px rgba(11,27,51,.05);--sh2:0 10px 40px rgba(11,27,51,.14);
  --ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;font-size:14px;line-height:1.5;min-height:100vh;font-feature-settings:"tnum"}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}
.hide{display:none!important}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ltr{direction:ltr;unicode-bidi:isolate}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(60% 50% at 50% 0%,rgba(201,168,76,.18),transparent 70%),linear-gradient(180deg,var(--navy),#061020)}
.lg-card{width:100%;max-width:400px;background:var(--surface);border-radius:24px;padding:32px 26px 26px;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:rise .6s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.lg-logo{height:46px;display:block;margin:0 auto 18px;padding:9px 16px;background:var(--navy);border-radius:14px;box-sizing:content-box}
.lg-card h1{font-size:21px;font-weight:700;text-align:center}
.lg-card p{color:var(--mut);text-align:center;margin:2px 0 22px}
.fld{display:block;margin-bottom:14px}
.fld span{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.inp{width:100%;background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:14.5px;transition:border-color .2s,box-shadow .2s,background .2s}
.inp:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 4px rgba(201,168,76,.15);background:#fff}
.pw{position:relative}
.pw .inp{padding-inline-end:44px}
.pw button{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:9px;color:var(--mut);display:grid;place-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:11px 18px;font-weight:600;font-size:14px;transition:transform .15s,background .2s,box-shadow .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-pri{background:var(--navy);color:#fff}
.btn-pri:hover{background:var(--navy2)}
.btn-gold{background:var(--gold);color:var(--navy)}
.btn-line{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.btn-line:hover{border-color:#cdd4df}
.btn-wa{background:var(--wa);color:#fff}
.w100{width:100%}
.err{color:var(--can);font-size:13px;font-weight:600;min-height:20px;margin-top:10px;text-align:center}
.lg-foot{text-align:center;color:var(--mut);font-size:12px;margin-top:14px;display:flex;align-items:center;justify-content:center;gap:6px}

/* ---------- header ---------- */
.hero{background:radial-gradient(50% 120% at 15% 0%,rgba(201,168,76,.16),transparent 60%),linear-gradient(180deg,var(--navy),var(--navy2));color:#fff;padding-bottom:64px}
.bar{max-width:1240px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:10px}
.bar img{height:30px}
.bar .sep{width:1px;height:22px;background:rgba(255,255,255,.18)}
.bar .ttl{font-weight:600;font-size:15px;color:rgba(255,255,255,.85)}
.bar .sp{flex:1}
.pill-live{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;padding:5px 11px;border-radius:50px;background:rgba(34,197,94,.14);color:#86efac}
.pill-live i{width:7px;height:7px;border-radius:50%;background:#22c55e;animation:ping 2s infinite}
.pill-live.off{background:rgba(248,113,113,.14);color:#fca5a5}
.pill-live.off i{background:#ef4444;animation:none}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(34,197,94,.7)}70%,100%{box-shadow:0 0 0 7px rgba(34,197,94,0)}}
.hb{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:rgba(255,255,255,.85);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);transition:background .2s}
.hb:hover{background:rgba(255,255,255,.14)}
.hb.spin svg{animation:spin .8s linear}
@keyframes spin{to{transform:rotate(360deg)}}
.greet{max-width:1240px;margin:0 auto;padding:10px 16px 0}
.greet h2{font-size:22px;font-weight:700}
.greet p{color:rgba(255,255,255,.62);font-size:13.5px;margin-top:2px}
@media(max-width:560px){.bar .ttl,.bar .sep{display:none}.greet h2{font-size:19px}}

/* ---------- kpis ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:0 16px 40px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:-46px;position:relative}
@media(min-width:880px){.kpis{grid-template-columns:repeat(4,1fr);gap:14px}}
.kpi{background:var(--surface);border-radius:var(--r);padding:14px 15px;box-shadow:var(--sh);border:1px solid var(--line2);display:flex;flex-direction:column;gap:8px;text-align:start;transition:transform .25s var(--ease),box-shadow .25s}
button.kpi:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.kpi-h{display:flex;align-items:center;gap:8px;color:var(--ink2);font-size:12.5px;font-weight:600}
.kpi-ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center}
.kpi-ic svg.i{width:16px;height:16px}
.kpi b{font-size:26px;font-weight:700;line-height:1.1;letter-spacing:-.5px}
.kpi b small{font-size:13px;font-weight:600;color:var(--mut);letter-spacing:0;margin-inline-start:4px}
.kpi em{font-style:normal;font-size:12px;color:var(--mut)}

/* ---------- banner + toolbar ---------- */
.banner{display:flex;align-items:center;gap:12px;background:var(--gold-s);border:1px solid #f0e2b8;border-radius:14px;padding:11px 14px;margin-top:14px;font-size:13.5px;color:#6b5418;font-weight:500}
.banner .btn{margin-inline-start:auto;padding:8px 14px;font-size:13px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:18px 0 12px}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:4px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.tabs::-webkit-scrollbar{display:none}
.tab{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:9px;font-weight:600;font-size:13px;color:var(--ink2);white-space:nowrap;transition:background .2s,color .2s}
.tab:hover{background:#f4f6fa}
.tab.on{background:var(--navy);color:#fff}
.tab .n{min-width:20px;height:20px;padding:0 6px;border-radius:50px;background:#eef1f6;color:var(--ink2);font-size:11.5px;display:grid;place-items:center}
.tab.on .n{background:rgba(255,255,255,.16);color:#fff}
.tab .n.hot{background:var(--new);color:#fff}
.search{flex:1;min-width:220px;position:relative}
.search svg{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);color:var(--mut)}
.search .inp{background:var(--surface);padding-inline-start:38px}

/* ---------- layout ---------- */
.main{display:grid;gap:16px;align-items:start}
@media(min-width:1080px){.main{grid-template-columns:minmax(0,1fr) 440px}}
.grp{margin-bottom:16px}
.grp-h{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--mut);margin:0 4px 8px}
.grp-h::after{content:"";flex:1;height:1px;background:var(--line)}
.cards{display:grid;gap:8px}

/* ---------- booking card ---------- */
.card{position:relative;background:var(--surface);border:1px solid var(--line2);border-radius:var(--r);padding:13px 15px 13px 13px;box-shadow:var(--sh);cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;transition:border-color .2s,box-shadow .2s,transform .2s var(--ease);animation:rise .45s var(--ease) both;outline:0}
.card::before{content:"";position:absolute;inset-inline-start:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--c,var(--line))}
.card:hover{border-color:#d6dce6;box-shadow:var(--sh2)}
.card:focus-visible{box-shadow:0 0 0 3px rgba(201,168,76,.4)}
.card.sel{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,.18)}
.card.fresh{animation:fresh 1.8s var(--ease)}
@keyframes fresh{0%{box-shadow:0 0 0 0 rgba(201,168,76,.9);transform:scale(.98)}50%{box-shadow:0 0 0 12px rgba(201,168,76,0);transform:none}}
.av{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:16px;background:var(--cs,#eef1f6);color:var(--c,var(--ink2))}
.cb{min-width:0}
.cb-1{display:flex;align-items:center;gap:8px;min-width:0}
.cb-1 b{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.code{font-size:12px;color:var(--mut);font-weight:500;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.cb-2{color:var(--ink2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.cb-3{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;color:var(--mut);font-size:12.5px}
.cb-3 span{display:inline-flex;align-items:center;gap:5px}
.cb-3 svg.i{width:14px;height:14px}
.ce{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.amt{font-weight:700;font-size:15.5px;white-space:nowrap}
.amt small{font-size:11.5px;color:var(--mut);font-weight:500}
.qa{display:flex;gap:6px}
.qa a{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;border:1px solid var(--line);color:var(--ink2);transition:background .2s,color .2s,border-color .2s}
.qa a:hover{background:#f4f6fa}
.qa a.w{color:var(--wa)}
.qa svg.i{width:15px;height:15px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:50px;background:var(--cs);color:var(--c);white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-new{--c:var(--new);--cs:var(--new-s)}.s-contacted{--c:var(--con);--cs:var(--con-s)}.s-confirmed{--c:var(--cfm);--cs:var(--cfm-s)}.s-done{--c:var(--done);--cs:var(--done-s)}.s-cancelled{--c:var(--can);--cs:var(--can-s)}
@media(max-width:560px){.card{grid-template-columns:1fr auto;padding:13px 14px}.av{display:none}}
.empty{background:var(--surface);border:1px dashed #d6dce6;border-radius:var(--r);padding:48px 20px;text-align:center;color:var(--mut)}
.empty .ei{width:54px;height:54px;border-radius:16px;background:#f1f4f8;display:grid;place-items:center;margin:0 auto 12px;color:#9aa4b6}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:2px}
.skel{height:86px;border-radius:var(--r);background:linear-gradient(90deg,#eceff4 25%,#f6f8fb 50%,#eceff4 75%);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}

/* ---------- detail pane ---------- */
.pane{background:var(--surface);border:1px solid var(--line2);border-radius:20px;box-shadow:var(--sh);display:flex;flex-direction:column;overflow:hidden}
@media(min-width:1080px){.pane{position:sticky;top:16px;max-height:calc(100vh - 32px)}.ov{display:none}}
@media(max-width:1079px){
  .pane{position:fixed;z-index:41;inset:auto 0 0 0;height:94vh;height:94dvh;border-radius:22px 22px 0 0;transform:translateY(102%);transition:transform .45s var(--ease);box-shadow:0 -20px 60px rgba(0,0,0,.25)}
  .pane.on{transform:none}
  .pane.blank{display:none}
  .ov{position:fixed;inset:0;z-index:40;background:rgba(6,14,28,.5);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
  .ov.on{opacity:1;visibility:visible}
  .grab{display:block!important}
}
.grab{display:none;width:40px;height:4px;border-radius:4px;background:#d6dce6;margin:8px auto 0}
.ph{padding:14px 18px;border-bottom:1px solid var(--line2);display:flex;align-items:flex-start;gap:10px}
.ph .t{flex:1;min-width:0}
.ph .t b{font-size:18px;font-weight:700;display:block}
.ph .t div{display:flex;align-items:center;gap:8px;margin-top:3px;flex-wrap:wrap}
.xb{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--ink2);background:#f4f6fa}
.pb{flex:1;overflow-y:auto;padding:16px 18px 20px;overscroll-behavior:contain}
.pf{padding:12px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line2);display:grid;grid-template-columns:1fr 1fr auto;gap:8px;background:#fff}
.pf .btn{padding:11px 10px}
.blank-in{padding:70px 30px;text-align:center;color:var(--mut)}
.blank-in .ei{width:60px;height:60px;border-radius:18px;background:#f1f4f8;display:grid;place-items:center;margin:0 auto 12px;color:#9aa4b6}
.blank-in b{display:block;color:var(--ink);font-size:15px}

.sec{margin-bottom:18px}
.sec-h{font-size:12px;font-weight:600;color:var(--mut);margin-bottom:8px;letter-spacing:.2px}
/* stepper */
.steps{display:grid;grid-template-columns:repeat(4,1fr);position:relative}
.steps::before{content:"";position:absolute;top:15px;inset-inline:12.5%;height:2px;background:var(--line)}
.steps .bar-f{position:absolute;top:15px;inset-inline-start:12.5%;height:2px;background:var(--cfm);transition:width .5s var(--ease)}
.stp{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--mut)}
.stp i{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#fff;border:2px solid var(--line);color:var(--mut);font-style:normal;font-size:12.5px;transition:all .3s var(--ease)}
.stp:hover i{border-color:#b9c2d0}
.stp.done i{background:var(--cfm);border-color:var(--cfm);color:#fff}
.stp.cur i{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 0 0 5px rgba(10,22,40,.1)}
.stp.cur{color:var(--ink)}
.stp.done{color:var(--ink2)}
.st-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:12.5px;color:var(--mut)}
.lnk{color:var(--can);font-weight:600;font-size:12.5px;padding:4px 2px}
.lnk.sure{background:var(--can);color:#fff;border-radius:8px;padding:4px 10px}
.cancel-box{display:flex;align-items:center;gap:10px;background:var(--can-s);color:var(--can);border-radius:12px;padding:10px 12px;font-weight:600}
.cancel-box .btn{margin-inline-start:auto;padding:7px 12px;font-size:12.5px}
/* info */
.box{border:1px solid var(--line2);border-radius:14px;overflow:hidden}
.ir{display:flex;align-items:center;gap:12px;padding:11px 13px;border-bottom:1px solid var(--line2)}
.ir:last-child{border-bottom:0}
.ir .ic{width:32px;height:32px;border-radius:9px;background:#f4f6fa;display:grid;place-items:center;color:var(--ink2);flex:none}
.ir .ic svg.i{width:16px;height:16px}
.ir div{flex:1;min-width:0}
.ir small{display:block;color:var(--mut);font-size:11.5px;font-weight:500}
.ir b{font-weight:600;font-size:14px;word-break:break-word}
.ir a.go{color:var(--con);font-weight:600;font-size:12.5px}
.note{background:var(--gold-s);border:1px solid #f0e2b8;border-radius:12px;padding:10px 12px;color:#5d4914;font-size:13.5px;margin-top:8px}
.note small{display:block;font-weight:600;font-size:11.5px;color:var(--gold-d);margin-bottom:2px}
/* receipt */
.rc{border:1px solid var(--line2);border-radius:14px;padding:4px 14px}
.li{padding:11px 0;border-bottom:1px dashed var(--line)}
.li:last-child{border-bottom:0}
.li-h{display:flex;justify-content:space-between;gap:10px;font-weight:600}
.li-h span:last-child{white-space:nowrap}
.li p{color:var(--mut);font-size:12.5px;margin-top:2px}
.li .sv{color:var(--cfm);font-weight:600}
.li .pa{color:var(--new)}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding:13px 14px;background:var(--navy);color:#fff;border-radius:14px;margin-top:8px}
.tot span{font-size:13px;color:rgba(255,255,255,.7)}
.tot b{font-size:20px;font-weight:700}
.tot b small{font-size:12px;font-weight:500;color:rgba(255,255,255,.7)}
.save-row{display:flex;justify-content:space-between;color:var(--cfm);font-weight:600;font-size:13px;padding:8px 4px 0}
.fin{display:flex;justify-content:space-between;color:var(--gold-d);font-weight:600;font-size:13px;padding:6px 4px 0}
/* form */
.frm label{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin:0 0 6px}
.frm .g2{display:grid;grid-template-columns:140px 1fr;gap:10px;margin-bottom:12px}
.frm textarea{resize:vertical;min-height:76px;margin-bottom:12px}
.unit{position:relative}
.unit span{position:absolute;inset-inline-end:12px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:12.5px}
.saved{color:var(--cfm);font-size:12.5px;font-weight:600;text-align:center;margin-top:8px;min-height:18px}

.toast{position:fixed;z-index:60;left:50%;bottom:24px;transform:translate(-50%,24px);opacity:0;display:flex;align-items:center;gap:8px;padding:11px 18px;border-radius:12px;background:var(--navy);color:#fff;font-weight:600;font-size:13.5px;box-shadow:var(--sh2);transition:all .35s var(--ease);pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
body.sheet .toast{bottom:92px}
.toast svg.i{color:var(--gold)}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-phone" viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></symbol>
  <symbol id="i-wa" viewBox="0 0 24 24"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22z"/><path d="M8.5 9.5c.3 2.6 3.4 5.7 6 6l1.2-1.4-1.9-1-1 .8c-1-.4-2.2-1.6-2.6-2.6l.8-1-1-1.9z"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></symbol>

        }).join('') + '</div><div class="st-foot"><span>اضغط على المرحلة عشان تحدّث الحالة</span><button class="lnk" id="p-cancel">إلغاء الحجز</button></div>';

    var items = (r.items || []).map(function (x) {
      return '<div class="li"><div class="li-h"><span>' + esc(x.name) + '</span><span>' + (x.quote ? 'عرض سعر' : (x.from ? 'من ' : '') + fmt(x.price) + ' ريال' + (x.perVisit ? ' / زيارة' : '')) + '</span></div>' +
        '<p>' + esc(x.label) + '</p>' +
        (x.save || []).map(function (s) { return '<p class="sv">' + esc(s.t) + ' · وفّر ' + fmt(s.v) + ' ريال</p>'; }).join('') +
        ((x.partial || []).length ? '<p class="pa">بعد المعاينة: ' + esc(x.partial.join('، ')) + '</p>' : '') + '</div>';
    }).join('');

    $('#p-bd').innerHTML =
      '<div class="sec"><div class="sec-h">حالة الطلب</div>' + steps + '</div>' +
      '<div class="sec"><div class="sec-h">العميل والموعد</div><div class="box">' +
        '<div class="ir"><span class="ic">' + ic('user') + '</span><div><small>العميل</small><b>' + esc(r.name) + '</b></div></div>' +
        '<div class="ir"><span class="ic">' + ic('phone') + '</span><div><small>الجوال</small><b class="ltr">' + esc(r.phone) + '</b></div><a class="go" href="tel:' + esc(r.phone) + '">اتصال</a></div>' +
        '<div class="ir"><span class="ic">' + ic('pin') + '</span><div><small>الحي</small><b>' + esc(r.district) + '</b></div>' + (r.location ? '<a class="go" target="_blank" rel="noopener" href="' + esc(r.location) + '">افتح الخريطة</a>' : '') + '</div>' +
        '<div class="ir"><span class="ic">' + ic(r.period === 'pm' ? 'moon' : 'sun') + '</span><div><small>موعد الزيارة</small><b>' + fullDay(r.visit_date) + ' · ' + per(r.period) + '</b></div></div>' +
      '</div>' + (r.notes ? '<div class="note"><small>ملاحظة العميل</small>' + esc(r.notes) + '</div>' : '') + '</div>' +
      '<div class="sec"><div class="sec-h">الخدمات المطلوبة</div><div class="rc">' + items + '</div>' +
        '<div class="tot"><span>الإجمالي ' + (r.price_from ? 'المبدئي (يبدأ من)' : 'المبدئي') + '</span><b>' + fmt(r.total) + ' <small>ريال</small></b></div>' +
        (r.savings ? '<div class="save-row"><span>وفّر العميل من العروض</span><span>' + fmt(r.savings) + ' ريال</span></div>' : '') +
        (r.final_price != null ? '<div class="fin"><span>السعر النهائي بعد المعاينة</span><span>' + fmt(r.final_price) + ' ريال</span></div>' : '') + '</div>' +
      '<div class="sec frm"><div class="sec-h">المتابعة الداخلية</div>' +
        '<div class="g2"><div><label for="p-final">السعر النهائي</label><div class="unit"><input class="inp" id="p-final" inputmode="numeric" value="' + (r.final_price != null ? r.final_price : '') + '" placeholder="' + fmt(r.total) + '"><span>ريال</span></div></div>' +
        '<div><label for="p-fnote">سبب تغيير السعر</label><input class="inp" id="p-fnote" value="' + esc(r.final_note || '') + '" placeholder="مثلًا: المساحة أكبر من المحدد"></div></div>' +
        '<label for="p-anote">ملاحظات للفريق</label><textarea class="inp" id="p-anote" placeholder="مثلًا: الفريق 2، العميل يفضّل بعد العصر">' + esc(r.admin_note || '') + '</textarea>' +
        '<button class="btn btn-gold w100" id="p-save">' + ic('save') + 'حفظ التعديلات</button><div class="saved" id="p-saved"></div></div>';

    $('#p-ft').innerHTML = '<a class="btn btn-wa" href="' + waLink(r) + '" target="_blank" rel="noopener">' + ic('wa') + 'واتساب</a>' +
      '<a class="btn btn-pri" href="tel:' + esc(r.phone) + '">' + ic('phone') + 'اتصال</a>' +
      (r.location ? '<a class="btn btn-line" target="_blank" rel="noopener" href="' + esc(r.location) + '" title="الموقع على الخريطة" aria-label="الموقع">' + ic('pin') + '</a>' : '<span class="btn btn-line" style="opacity:.35" title="ما أرسل موقع">' + ic('pin') + '</span>');

    $('#pane').classList.remove('blank'); $('#blank').classList.add('hide');
    ['#p-hd', '#p-bd', '#p-ft'].forEach(function (s) { $(s).classList.remove('hide'); });
    document.querySelectorAll('.card.sel').forEach(function (c) { c.classList.remove('sel'); });
    var c = document.querySelector('.card[data-id="' + id + '"]'); if (c) c.classList.add('sel');
    if (!keep) { $('#p-bd').scrollTop = 0; if (!wide.matches) { $('#ov').classList.add('on'); $('#pane').classList.add('on'); document.body.style.overflow = 'hidden'; document.body.classList.add('sheet'); } }
  }
  function closePane() {
    openId = null; $('#ov').classList.remove('on'); $('#pane').classList.remove('on'); document.body.style.overflow = ''; document.body.classList.remove('sheet');
    document.querySelectorAll('.card.sel').forEach(function (c) { c.classList.remove('sel'); });
    setTimeout(function () { if (openId != null) return; $('#pane').classList.add('blank'); $('#blank').classList.remove('hide'); ['#p-hd', '#p-bd', '#p-ft'].forEach(function (s) { $(s).classList.add('hide'); }); }, wide.matches ? 0 : 450);
  }
  $('#ov').addEventListener('click', closePane);
  $('#pane').addEventListener('click', function (e) { if (e.target.closest('#p-x')) closePane(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && openId != null) closePane(); });

  function update(id, patch, msg, cb) {
    var done = function (row) { rows = rows.map(function (x) { return x.id === id ? row : x; }); render(); openPane(id, true); toast(msg); if (cb) cb(); };
    if (DEMO) { var r0 = rows.filter(function (x) { return x.id === id; })[0]; return done(Object.assign({}, r0, patch)); }
    sb.from('bookings').update(patch).eq('id', id).select().single().then(function (r) {
      if (r.error) { toast('ما انحفظ، جرّب مرة ثانية'); return; }
      done(r.data);
    });
  }
  $('#p-bd').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b || openId == null) return;
    if (b.hasAttribute('data-s')) { var s = b.getAttribute('data-s'); update(openId, { status: s }, s === 'new' ? 'رجّعنا الحجز' : 'صار الحجز: ' + STN[s]); }
    if (b.id === 'p-cancel') {
      if (!b.classList.contains('sure')) { b.classList.add('sure'); b.textContent = 'متأكد؟ اضغط للإلغاء'; setTimeout(function () { b.classList.remove('sure'); b.textContent = 'إلغاء الحجز'; }, 3500); return; }
      update(openId, { status: 'cancelled' }, 'تم إلغاء الحجز');
    }
    if (b.id === 'p-save') {
      var v = String($('#p-final').value || '').replace(/[٠-٩]/g, function (c) { return '٠١٢٣٤٥٦٧٨٩'.indexOf(c); }).replace(/[^\d]/g, '');
      update(openId, { final_price: v ? +v : null, final_note: $('#p-fnote').value.trim() || null, admin_note: $('#p-anote').value.trim() || null }, 'تم حفظ التعديلات',
        function () { $('#p-saved').textContent = '✓ انحفظ ' + clock(new Date()); });
    }
  });
  if (wide.addEventListener) wide.addEventListener('change', function () { if (openId != null) { var id = openId; $('#ov').classList.remove('on'); $('#pane').classList.remove('on'); document.body.style.overflow = ''; openPane(id); } });

  /* ---------- export ---------- */
  $('#b-csv').addEventListener('click', function () {
    var head = ['رقم الحجز', 'وصل', 'الحالة', 'الاسم', 'الجوال', 'الحي', 'الموعد', 'الفترة', 'الخدمات', 'الإجمالي', 'السعر النهائي', 'وفّر', 'ملاحظات العميل', 'ملاحظات داخلية'];
    var lines = [head].concat(rows.map(function (r) {
      return [r.code, ksa(r.created_at) + ' ' + clock(r.created_at), STN[r.status], r.name, r.phone, r.district, r.visit_date, perS(r.period),
        (r.items || []).map(function (x) { return x.name + ': ' + x.label; }).join(' | '), r.total, r.final_price == null ? '' : r.final_price, r.savings, r.notes || '', r.admin_note || ''];
    })).map(function (row) { return row.map(function (c) { c = String(c == null ? '' : c); return /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(','); }).join('\n');
    var a = document.createElement('a'); a.href = window.URL.createObjectURL(new Blob(['﻿' + lines], { type: 'text/csv;charset=utf-8' }));
    a.download = 'naqaa-bookings-' + ksa() + '.csv'; a.click(); toast('تم تنزيل الملف');
  });
  setInterval(function () { if (rows.length) { greet(); render(); } }, 60000);

  /* ---------- local design preview only (localhost ?demo) ---------- */
  function demoRows() {
    var t = ksa(), now = Date.now(), H = 3600e3;
    var mk = function (id, h, st, name, ph, dist, vd, p, items, tot, extra) { return Object.assign({ id: id, code: 'NQ-' + (1000 + id), created_at: new Date(now - h * H).toISOString(), status: st, name: name, phone: ph, district: dist, visit_date: addDay(t, vd), period: p, items: items, total: tot, savings: 0, price_from: false, has_quote: false, location: null, notes: null, final_price: null, final_note: null, admin_note: null }, extra || {}); };
    return [
      mk(12, .2, 'new', 'عبدالله القحطاني', '0551234567', 'النرجس', 1, 'am', [{ name: 'تنظيف خزانات', label: 'علوي لحد 1,000 لتر + أرضي شقة', price: 400, save: [{ t: 'باقة العلوي والأرضي', v: 50 }] }, { name: 'تنظيف مكيفات', label: '3 مكيفات سبليت', price: 195 }], 595, { savings: 50, location: 'https://maps.google.com/?q=24.8,46.6', notes: 'البواب موجود بعد العصر' }),
      mk(11, 1.5, 'new', 'نورة العتيبي', '0509876543', 'الياسمين', 2, 'pm', [{ name: 'تنظيف فلل', label: '300–500 م² · مفروشة', price: 1200 }], 1200),
      mk(10, 5, 'contacted', 'فهد الدوسري', '0544441122', 'الملقا', 0, 'am', [{ name: 'مجالس وكنب وستائر', label: 'عرض المجلس الكامل + 4 ستائر', price: 475, save: [{ t: 'عرض المجلس الكامل', v: 60 }] }], 475, { savings: 60 }),
      mk(9, 26, 'confirmed', 'سارة الشهري', '0567778899', 'العليا', 0, 'pm', [{ name: 'مكافحة حشرات', label: 'مكافحة شاملة · شقة', price: 250 }], 250),
      mk(8, 30, 'confirmed', 'شركة الأفق', '0533332211', 'الملز', 1, 'am', [{ name: 'تنظيف مكاتب وشركات', label: 'أكبر من 200 م²', price: 600, from: true, partial: ['المساحة النهائية'] }], 600, { price_from: true }),
      mk(7, 50, 'done', 'محمد الغامدي', '0550001111', 'الروضة', -1, 'am', [{ name: 'سجاد وموكيت', label: '3 سجادات · 18 م²', price: 180 }], 180, { final_price: 200, final_note: 'السجاد أكبر' }),
      mk(6, 75, 'cancelled', 'خالد المطيري', '0559990000', 'الشفا', 3, 'pm', [{ name: 'عزل خزانات', label: 'خزان فيلا', price: 1200 }], 1200)
    ];
  }
})();
</script>
