.hero-bg-overlay{position:absolute;inset:0;background:linear-gradient(to left,rgba(6,14,30,.30) 0%,rgba(6,14,30,.55) 45%,rgba(6,14,30,.72) 100%)}

.hero-ambient{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1}
.bokeh{position:absolute;border-radius:50%;filter:blur(46px);background:radial-gradient(circle,rgba(201,168,76,.45),transparent 70%);animation:bokehDrift ease-in-out infinite alternate}
.bokeh-1{width:280px;height:280px;top:-60px;right:6%;opacity:.30;animation-duration:26s}
.bokeh-2{width:200px;height:200px;bottom:2%;left:4%;opacity:.24;background:radial-gradient(circle,rgba(228,191,106,.4),transparent 70%);animation-duration:21s;animation-delay:-6s}
.bokeh-3{width:340px;height:340px;top:26%;right:32%;opacity:.14;animation-duration:32s;animation-delay:-14s}
@keyframes bokehDrift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-3%,4%) scale(1.06)}100%{transform:translate(3%,-3%) scale(.97)}}

.sparkle{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 6px 2px rgba(245,217,142,.75);opacity:0;animation:sparkleTwinkle ease-in-out infinite}
@keyframes sparkleTwinkle{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:.85;transform:scale(1)}}
.sparkle:nth-child(4){top:18%;left:22%;animation-duration:5.5s;animation-delay:.2s}
.sparkle:nth-child(5){top:64%;left:12%;animation-duration:6.5s;animation-delay:1.8s}
.sparkle:nth-child(6){top:30%;left:68%;animation-duration:5s;animation-delay:.9s}
.sparkle:nth-child(7){top:75%;left:58%;animation-duration:7s;animation-delay:2.6s}
.sparkle:nth-child(8){top:45%;left:85%;animation-duration:6s;animation-delay:1.3s}
.sparkle:nth-child(9){top:12%;left:48%;animation-duration:5.8s;animation-delay:3.2s}
.sparkle:nth-child(10){top:85%;left:30%;animation-duration:6.8s;animation-delay:.5s}

.hero-bubble{position:absolute;bottom:-12%;border-radius:50%;border:1.5px solid rgba(248,246,240,.5);background:radial-gradient(circle at 32% 28%,rgba(248,246,240,.35),rgba(248,246,240,.05) 60%,transparent 75%);box-shadow:inset 0 0 12px rgba(248,246,240,.15);animation:heroBubbleRise linear infinite}
.hb-1{left:8%;width:38px;height:38px;animation-duration:15s;animation-delay:0s}
.hb-2{left:24%;width:24px;height:24px;animation-duration:12s;animation-delay:3s}
.hb-3{left:46%;width:56px;height:56px;animation-duration:18s;animation-delay:6s}
.hb-4{left:66%;width:30px;height:30px;animation-duration:14s;animation-delay:2s}
.hb-5{left:84%;width:44px;height:44px;animation-duration:16.5s;animation-delay:8.5s}
.hb-6{left:36%;width:20px;height:20px;animation-duration:11s;animation-delay:5s}
.hb-7{left:92%;width:30px;height:30px;animation-duration:13.5s;animation-delay:1s}
@keyframes heroBubbleRise{0%{transform:translateY(0) translateX(0);opacity:0}10%{opacity:.85}88%{opacity:.4}100%{transform:translateY(-125%) translateX(16px);opacity:0}}

.btn-primary::after,.hero-badge::after{content:'';position:absolute;top:0;bottom:0;left:-60%;width:35%;background:linear-gradient(120deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:lightSweep 11s ease-in-out infinite}
.hero-badge::after{animation-duration:9s;animation-delay:2.5s;background:linear-gradient(120deg,transparent,rgba(255,255,255,.4),transparent)}
@keyframes lightSweep{0%{left:-60%}7%{left:140%}100%{left:140%}}

.hero-content-centered{position:relative;z-index:2;width:100%;display:flex;justify-content:center;max-width:820px;margin:0 auto;padding:150px 24px 90px}
.hero-center-wrap{width:100%;text-align:center;display:flex;flex-direction:column;align-items:center}

.hero-badge{position:relative;overflow:hidden;display:flex;width:auto;justify-content:center;align-items:center;gap:8px;background:linear-gradient(135deg,var(--gold),var(--gold2));border:none;padding:9px 22px;border-radius:50px;font-size:13px;font-weight:800;color:var(--navy);margin-bottom:28px;box-shadow:0 6px 20px rgba(201,168,76,.35);animation:fadeDown .8s ease}
@keyframes fadeDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}

.hero-title{font-family:'Tajawal',sans-serif;font-size:clamp(38px,5.4vw,62px);font-weight:900;line-height:1.25;margin-bottom:24px;text-align:center;animation:fadeUp .8s ease .2s both}
.hero-title .highlight{background:linear-gradient(135deg,var(--gold),var(--gold3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-sub{font-size:clamp(15px,2.1vw,17px);font-weight:600;color:rgba(248,246,240,.75);line-height:1.9;margin-bottom:40px;text-align:center;max-width:680px;animation:fadeUp .8s ease .4s both}

.btn-primary{position:relative;overflow:hidden;isolation:isolate;background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--navy);border-radius:50px;border:none;cursor:pointer;transition:all .3s;box-shadow:0 6px 20px rgba(201,168,76,.35);display:inline-flex;align-items:center;gap:8px;white-space:nowrap;text-decoration:none;font-size:17px;font-weight:800;padding:17px 44px;animation:fadeUp .8s ease .6s both}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(201,168,76,.45)}

@media(max-width:768px){
  .hero-content-centered{padding:120px 20px 60px}
  .btn-primary{width:100%;justify-content:center}
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important}
}
</style>
</head>
